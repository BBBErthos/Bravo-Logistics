<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bravo — Gate Check-In</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F0F2F5;--surface:#FFFFFF;--surface2:#E8ECF0;--border:#B0BAC5;
  --navy:#1A2B3C;--blue:#1565C0;--blue-dim:#E3EEF9;
  --green:#1B7A3E;--green-dim:#E6F4EC;--green-bg:#C8E6D4;
  --amber:#B45000;--amber-dim:#FFF3E0;
  --red:#C62828;--red-dim:#FFEBEE;
  --text:#0D1B2A;--text2:#374A5C;--text3:#6B7C8D;
  --r:8px;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  --shadow:0 2px 8px rgba(0,0,0,0.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;min-height:100vh;line-height:1.5}

/* Header */
.header{background:var(--navy);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.logo{width:36px;height:36px;background:#F0A500;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:14px;color:#000;flex-shrink:0}
.htitle{font-family:var(--mono);font-size:14px;color:#CBD5E0;margin-left:12px}
.htitle span{color:#FFFFFF;font-weight:600}
.hdate{font-family:var(--mono);font-size:12px;color:#90A4B4;background:rgba(255,255,255,0.1);padding:4px 10px;border-radius:4px}

/* Main */
.main{max-width:680px;margin:0 auto;padding:24px 16px 80px}

/* Role badge */
.role-badge{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#FFFFFF;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;padding:6px 14px;border-radius:4px;text-transform:uppercase;margin-bottom:20px}

/* Section label */
.slabel{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.slabel::after{content:'';flex:1;height:2px;background:var(--border)}

/* Delivery cards */
.delivery-list{display:flex;flex-direction:column;gap:12px}
.delivery-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);padding:18px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.delivery-card:hover{border-color:var(--blue);box-shadow:0 4px 16px rgba(21,101,192,0.2)}
.delivery-card.selected{border-color:var(--blue);background:var(--blue-dim);box-shadow:0 4px 16px rgba(21,101,192,0.25)}
.dc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dc-ref{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--navy)}
.dc-time{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--blue);background:var(--blue-dim);padding:4px 12px;border-radius:4px}
.dc-yard{font-size:13px;font-weight:700;color:var(--green);background:var(--green-dim);padding:3px 10px;border-radius:4px;font-family:var(--mono)}
.dc-details{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:8px}
.dc-field{display:flex;flex-direction:column}
.dc-label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.dc-value{font-size:15px;color:var(--text);font-weight:500;margin-top:1px}
.dc-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;font-family:var(--mono);padding:3px 10px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}
.dc-status.scheduled{background:#E8F5E9;color:#1B7A3E;border:1.5px solid #A5D6A7}

/* Empty / loading states */
.state-box{text-align:center;padding:60px 20px;background:var(--surface);border-radius:var(--r);border:2px solid var(--border)}
.state-icon{font-size:48px;margin-bottom:16px}
.state-box h3{font-size:18px;font-weight:600;color:var(--text);margin-bottom:8px}
.state-box p{color:var(--text3);font-size:15px}
.spin-wrap{display:flex;align-items:center;justify-content:center;gap:12px;padding:48px;color:var(--text3);font-size:15px}
.spin{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Notes field */
.notes-field{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);padding:14px;width:100%;font-family:var(--sans);font-size:16px;color:var(--text);outline:none;resize:vertical;min-height:80px;margin-top:6px;transition:border-color .15s}
.notes-field:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,101,192,0.15)}

/* Confirm panel */
.confirm-panel{background:var(--blue-dim);border:2px solid var(--blue);border-radius:var(--r);padding:20px;margin-top:20px;display:none}
.confirm-panel.vis{display:block}
.confirm-panel h3{font-size:16px;font-weight:700;color:var(--blue);margin-bottom:14px;font-family:var(--mono)}
.confirm-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(21,101,192,0.2);font-size:15px}
.confirm-row:last-of-type{border-bottom:none}
.confirm-row span:first-child{color:var(--text3);font-weight:500}
.confirm-row span:last-child{color:var(--navy);font-weight:700;font-family:var(--mono)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 24px;border-radius:var(--r);font-family:var(--sans);font-size:16px;font-weight:700;cursor:pointer;border:none;transition:all .15s;width:100%;margin-top:12px}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 3px 8px rgba(21,101,192,0.4)}
.btn-primary:hover{background:#0D47A1;box-shadow:0 4px 12px rgba(21,101,192,0.5)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:var(--surface2);color:var(--text2);border:2px solid var(--border)}
.btn-secondary:hover{border-color:var(--text3)}
.btn-success{background:var(--green);color:#fff;box-shadow:0 3px 8px rgba(27,122,62,0.4)}
.btn-success:hover{background:#145A2E}

/* Success screen */
.success-screen{display:none;text-align:center;padding:60px 20px}
.success-screen.vis{display:block}
.s-icon{width:80px;height:80px;background:var(--green-dim);border:3px solid var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:36px}
.success-screen h2{font-size:24px;font-weight:700;color:var(--navy);margin-bottom:8px}
.success-screen p{color:var(--text2);font-size:16px;margin-bottom:6px}
.s-ref{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--blue);background:var(--blue-dim);border:2px solid var(--blue);padding:12px 24px;border-radius:var(--r);display:inline-block;margin:16px 0 24px}
.s-detail{background:var(--green-dim);border:2px solid var(--green-bg);border-radius:var(--r);padding:16px;max-width:400px;margin:0 auto 24px;text-align:left}
.s-detail-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--green-bg);font-size:15px}
.s-detail-row:last-child{border-bottom:none}
.s-detail-row span:first-child{color:var(--text3);font-weight:500}
.s-detail-row span:last-child{color:var(--navy);font-weight:700}

/* Toast */
.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;min-width:300px}
.toast{background:var(--navy);color:#fff;border-radius:var(--r);padding:14px 18px;font-size:15px;box-shadow:0 4px 20px rgba(0,0,0,0.3);display:flex;align-items:center;gap:10px;animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast.info{background:var(--blue)}

.form-wrap.hidden{display:none}
.section{margin-bottom:24px}



/* ── INFO TOOLTIP ─────────────────────────────────────────────────────────── */
.info-wrap{position:static;display:inline-flex;align-items:center}
.info-btn{width:22px;height:22px;border-radius:50%;background:#90A4B4;color:#fff;font-size:11px;font-weight:700;border:2px solid #fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;margin-left:6px;vertical-align:middle;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,0.15)}
.info-btn:hover,.info-btn.active{background:#F5620F;border-color:#F5620F;box-shadow:0 2px 8px rgba(245,98,15,0.4)}
.info-tip{display:none;position:fixed;background:#FFFFFF;color:#1A2B3C;font-size:13px;font-weight:500;line-height:1.6;padding:14px 18px;border-radius:8px;width:260px;box-shadow:0 8px 32px rgba(0,0,0,0.18),0 0 0 1.5px #E0E7EF;z-index:9999;pointer-events:none}
.info-tip.show{display:block}
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center">
    <div class="logo">B</div>
    <div class="htitle" style="margin-left:12px"><span>BRAVO</span> — Gate Check-In</div>
  </div>
  <a href="index.html" style="display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#90A4B4;text-decoration:none;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);padding:5px 12px;border-radius:4px;transition:all .15s" onmouseover="this.style.color='#F5620F';this.style.borderColor='#F5620F'" onmouseout="this.style.color='#90A4B4';this.style.borderColor='rgba(255,255,255,0.12)'">⌂ Home</a>
  <div class="hdate" id="hdate"></div>
</div>

<div class="main">

  <!-- Success -->
  <div class="success-screen" id="ss">
    <div class="s-icon">✓</div>
    <h2>Driver checked in</h2>
    <p>Delivery marked <strong>On Site</strong>. Yard Lead has been notified.</p>
    <div class="s-ref" id="ssRef"></div>
    <div class="s-detail" id="ssDetail"></div>
    <button class="btn btn-primary" onclick="reset()">Check in another truck</button>
  </div>

  <!-- Form -->
  <div class="form-wrap" id="fw">

    <div class="role-badge">🚚 Gate Marshal — Check-In</div>

    <!-- Delivery list -->
    <div class="section">
      <div class="slabel">Today's scheduled deliveries</div>
      <div id="deliveryArea">
        <div class="spin-wrap"><div class="spin"></div>Loading scheduled deliveries...</div>
      </div>
      <button class="btn btn-secondary" onclick="loadDeliveries()" style="margin-top:12px;width:auto;padding:10px 20px">
        ↻ Refresh
      </button>
    </div>

    <!-- Confirm panel (shown after selection) -->
    <div class="confirm-panel" id="confirmPanel">
      <h3>📋 Confirm Check-In</h3>
      <div id="confirmRows"></div>
      <div style="margin-top:16px">
        <label style="font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em">Notes (optional)</label>
        <textarea class="notes-field" id="marshalNotes" placeholder="Any notes about this arrival — oversized load, special instructions, etc."></textarea>
      </div>
      <button class="btn btn-success" id="checkinBtn" onclick="checkIn()">
        ✓ Mark Driver On Site
      </button>
      <button class="btn btn-secondary" onclick="clearSelection()" style="margin-top:8px">
        Cancel
      </button>
    </div>

  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
// ── Config ────────────────────────────────────────────────────────────────────
const TOKEN    = BRAVO_CONFIG.TOKEN;
const DEL_BOARD = BRAVO_CONFIG.DEL_BOARD;

const DEL_COL = {
  bol:       "text_mm21d399",
  carrier:   "text_mm21mxr7",
  email:     "text_mm21nbps",
  timeSlot:  "text_mm2973m4",
  status:    "color_mm21zhcs",
  date:      "date_mm21td8v",
  poNumber:  "text_mm29xaqd",
  yard:      "color_mm29fpxq",
  recRef:    "text_mm2d6dw2"
};

let deliveries    = [];
let selectedItem  = null;

// ── GQL ───────────────────────────────────────────────────────────────────────
async function gql(query, variables = {}) {
  const r = await fetch("https://api.monday.com/v2", {
    method: "POST",
    headers: { "Authorization": TOKEN, "Content-Type": "application/json", "API-Version": "2024-01" },
    body: JSON.stringify({ query, variables })
  });
  const d = await r.json();
  if (d.errors) throw new Error(d.errors[0].message);
  return d.data;
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", init);
window.addEventListener("load", init);
let _inited = false;
async function init() {
  if (_inited) return;
  _inited = true;
  const user = await requireAuth();
  if (!user && typeof AUTH_ENABLED !== "undefined" && AUTH_ENABLED) return;
  // Set header date
  const now = new Date();
  document.getElementById("hdate").textContent =
    now.toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" });
  await loadDeliveries();
}

// ── Load today's scheduled deliveries ─────────────────────────────────────────
async function loadDeliveries() {
  const area = document.getElementById("deliveryArea");
  area.innerHTML = '<div class="spin-wrap"><div class="spin"></div>Loading scheduled deliveries...</div>';
  clearSelection();

  try {
    const today = new Date().toISOString().split("T")[0];
    const d = await gql(`
      query {
        boards(ids:[${DEL_BOARD}]) {
          items_page(limit:100) {
            items {
              id name
              column_values { id text }
            }
          }
        }
      }
    `);

    const items = d.boards[0].items_page.items;
    deliveries = [];

    items.forEach(item => {
      const cv = {};
      item.column_values.forEach(c => { cv[c.id] = c.text || ""; });
      const itemDate   = cv[DEL_COL.date];
      const itemStatus = cv[DEL_COL.status];
      // Show Scheduled deliveries for today
      if (itemDate === today && itemStatus === "Scheduled") {
        deliveries.push({
          id:       item.id,
          name:     item.name,
          date:     itemDate,
          timeSlot: cv[DEL_COL.timeSlot],
          yard:     cv[DEL_COL.yard],
          po:       cv[DEL_COL.poNumber],
          carrier:  cv[DEL_COL.carrier],
          bol:      cv[DEL_COL.bol],
          status:   itemStatus
        });
      }
    });

    // Sort by time slot
    deliveries.sort((a, b) => (a.timeSlot || "").localeCompare(b.timeSlot || ""));

    if (deliveries.length === 0) {
      area.innerHTML = `
        <div class="state-box">
          <div class="state-icon">📭</div>
          <h3>No scheduled deliveries today</h3>
          <p>All deliveries for today have been checked in, or none are scheduled.</p>
        </div>`;
    } else {
      renderDeliveryList();
    }
  } catch(e) {
    area.innerHTML = `
      <div class="state-box">
        <div class="state-icon">⚠️</div>
        <h3>Could not load deliveries</h3>
        <p>${e.message}</p>
      </div>`;
  }
}

// ── Render delivery cards ──────────────────────────────────────────────────────
function renderDeliveryList() {
  const area = document.getElementById("deliveryArea");
  area.innerHTML = "";
  const list = document.createElement("div");
  list.className = "delivery-list";

  deliveries.forEach(del => {
    const card = document.createElement("div");
    card.className = "delivery-card" + (selectedItem?.id === del.id ? " selected" : "");
    card.onclick = () => selectDelivery(del);
    card.innerHTML = `
      <div class="dc-top">
        <div class="dc-ref">${del.name}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="dc-time">${del.timeSlot || "—"}</div>
          <div class="dc-yard">${del.yard || "—"}</div>
        </div>
      </div>
      <div class="dc-details">
        <div class="dc-field">
          <div class="dc-label">Date</div>
          <div class="dc-value">${del.date || "—"}</div>
        </div>
        <div class="dc-field">
          <div class="dc-label">PO Number</div>
          <div class="dc-value">${del.po || "—"}</div>
        </div>
        <div class="dc-field">
          <div class="dc-label">Carrier</div>
          <div class="dc-value">${del.carrier || "—"}</div>
        </div>
        <div class="dc-field">
          <div class="dc-label">BOL #</div>
          <div class="dc-value">${del.bol || "—"}</div>
        </div>
        <div class="dc-field">
          <div class="dc-label">Status</div>
          <div class="dc-value"><span class="dc-status scheduled">Scheduled</span></div>
        </div>
      </div>`;
    list.appendChild(card);
  });

  area.appendChild(list);
}

// ── Select delivery ───────────────────────────────────────────────────────────
function selectDelivery(del) {
  selectedItem = del;
  renderDeliveryList(); // re-render to show selected state

  // Populate confirm panel
  document.getElementById("confirmRows").innerHTML = `
    <div class="confirm-row"><span>Reference</span><span>${del.name}</span></div>
    <div class="confirm-row"><span>Date</span><span>${del.date || "—"}</span></div>
    <div class="confirm-row"><span>Time Slot</span><span>${del.timeSlot || "—"}</span></div>
    <div class="confirm-row"><span>Receiving Yard</span><span>${del.yard || "—"}</span></div>
    <div class="confirm-row"><span>PO Number</span><span>${del.po || "—"}</span></div>
    <div class="confirm-row"><span>Carrier</span><span>${del.carrier || "—"}</span></div>
    <div class="confirm-row"><span>BOL #</span><span>${del.bol || "—"}</span></div>`;

  document.getElementById("confirmPanel").classList.add("vis");
  // Scroll to confirm panel
  document.getElementById("confirmPanel").scrollIntoView({ behavior: "smooth", block: "start" });
}

function clearSelection() {
  selectedItem = null;
  document.getElementById("confirmPanel").classList.remove("vis");
  document.getElementById("marshalNotes").value = "";
  if (deliveries.length > 0) renderDeliveryList();
}

// ── Check In ──────────────────────────────────────────────────────────────────
async function checkIn() {
  if (!selectedItem) return;
  const btn = document.getElementById("checkinBtn");
  btn.disabled = true; btn.textContent = "Checking in...";

  const notes = document.getElementById("marshalNotes").value.trim();

  try {
    // Update status to On Site
    await gql(
      `mutation($b:ID!,$i:ID!,$c:String!,$v:JSON!){ change_column_value(board_id:$b,item_id:$i,column_id:$c,value:$v){ id } }`,
      { b: DEL_BOARD, i: selectedItem.id, c: DEL_COL.status, v: JSON.stringify({ label: "On Site" }) }
    );

    showSuccess(selectedItem, notes);
  } catch(e) {
    toast("Check-in failed: " + e.message, "error");
    btn.disabled = false; btn.textContent = "✓ Mark Driver On Site";
  }
}

// ── Success ───────────────────────────────────────────────────────────────────
function showSuccess(del, notes) {
  document.getElementById("fw").classList.add("hidden");
  document.getElementById("ss").classList.add("vis");
  document.getElementById("ssRef").textContent = del.name;
  document.getElementById("ssDetail").innerHTML = `
    <div class="s-detail-row"><span>Time Slot</span><span>${del.timeSlot || "—"}</span></div>
    <div class="s-detail-row"><span>Yard</span><span>${del.yard || "—"}</span></div>
    <div class="s-detail-row"><span>PO Number</span><span>${del.po || "—"}</span></div>
    <div class="s-detail-row"><span>Carrier</span><span>${del.carrier || "—"}</span></div>
    ${notes ? `<div class="s-detail-row"><span>Notes</span><span>${notes}</span></div>` : ""}`;
  toast("Driver checked in — Yard Lead notified", "success");
}

// ── Reset ─────────────────────────────────────────────────────────────────────
async function reset() {
  // Fully reset confirm panel and button before reloading
  selectedItem = null;
  const btn = document.getElementById("checkinBtn");
  if (btn) { btn.disabled = false; btn.textContent = "✓ Mark Driver On Site"; }
  document.getElementById("confirmPanel").classList.remove("vis");
  document.getElementById("marshalNotes").value = "";
  document.getElementById("confirmRows").innerHTML = "";
  document.getElementById("fw").classList.remove("hidden");
  document.getElementById("ss").classList.remove("vis");
  await loadDeliveries();
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg, type = "info") {
  const c = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = `toast ${type}`;
  const ic = type === "success" ? "✓" : type === "error" ? "✕" : "ℹ";
  t.innerHTML = `<span>${ic}</span> ${msg}`;
  c.appendChild(t);
  setTimeout(() => {
    t.style.cssText = "opacity:0;transform:translateY(10px);transition:all .3s";
    setTimeout(() => t.remove(), 300);
  }, type === "error" ? 7000 : 4000);
}
</script>

<script>
// Info button tap/click toggle with smart positioning
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('info-btn')) {
    e.stopPropagation();
    const isActive = e.target.classList.contains('active');
    // Close all
    document.querySelectorAll('.info-btn.active').forEach(b => {
      b.classList.remove('active');
      const tip = b.nextElementSibling;
      if (tip && tip.classList.contains('info-tip')) tip.classList.remove('show');
    });
    if (!isActive) {
      e.target.classList.add('active');
      const tip = e.target.nextElementSibling;
      if (tip && tip.classList.contains('info-tip')) {
        tip.classList.add('show');
        // Position tooltip near the button, avoiding edges
        const rect = e.target.getBoundingClientRect();
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        let left = rect.left + rect.width / 2 - 130; // center on button
        let top  = rect.top - 10; // above button, will adjust
        // Keep within horizontal bounds
        if (left < 12) left = 12;
        if (left + 260 > vw - 12) left = vw - 272;
        // If not enough space above, show below
        if (rect.top < 120) top = rect.bottom + 10;
        else top = rect.top - tip.offsetHeight - 10;
        if (top < 10) top = rect.bottom + 10;
        tip.style.left = left + 'px';
        tip.style.top  = top  + 'px';
      }
    }
  } else {
    document.querySelectorAll('.info-btn.active').forEach(b => {
      b.classList.remove('active');
      const tip = b.nextElementSibling;
      if (tip && tip.classList.contains('info-tip')) tip.classList.remove('show');
    });
  }
});
</script>
</body>
</html>
